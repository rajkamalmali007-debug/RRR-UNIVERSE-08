<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRR Universe - Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#050505;
    color:white;
}

/* NAV */
nav{
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px;
    background:rgba(255,255,255,0.05);
}

nav a{
    color:white;
    text-decoration:none;
}

nav a:hover{
    color:#ffd700;
}

/* DASHBOARD */
h1{
    text-align:center;
    color:#ffd700;
    text-shadow:0 0 20px #ffd700;
    margin-top:20px;
}

/* PRICE BOXES */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    padding:30px;
}

.box{
    background:rgba(255,255,255,0.05);
    padding:20px;
    border-left:3px solid #ffd700;
    border-radius:10px;
    box-shadow:0 0 15px rgba(255,215,0,0.1);
    transition:0.3s;
}

.box:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px rgba(255,215,0,0.3);
}

.price{
    font-size:22px;
    color:#00ff99;
}

/* MINI CHART */
.chart-bar{
    height:40px;
    display:flex;
    align-items:flex-end;
    gap:4px;
    margin-top:10px;
}

.bar{
    width:6px;
    background:linear-gradient(#00c3ff,#ffd700);
    animation:updown 1.2s infinite ease-in-out;
}

.bar:nth-child(1){height:20px;}
.bar:nth-child(2){height:35px;}
.bar:nth-child(3){height:15px;}
.bar:nth-child(4){height:30px;}
.bar:nth-child(5){height:25px;}

@keyframes updown{
    0%,100%{transform:scaleY(0.7);}
    50%{transform:scaleY(1.3);}
}
</style>

</head>

<body>

<nav>
<a href="index.html">Home</a>
<a href="dashboard.html">Dashboard</a>
<a href="community.html">Community</a>
<a href="contact.html">Contact</a>
</nav>

<h1>📊 Trading Dashboard</h1>

<div class="grid">

<div class="box">
<h3>Bitcoin (BTC)</h3>
<p class="price">$67,450</p>
<div class="chart-bar">
<div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>
</div>

<div class="box">
<h3>Ethereum (ETH)</h3>
<p class="price">$3,120</p>
<div class="chart-bar">
<div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>
</div>

<div class="box">
<h3>NIFTY 50</h3>
<p class="price">22,180</p>
<div class="chart-bar">
<div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>
</div>

</div>

</body>
</html>
